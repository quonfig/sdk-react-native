# Dependabot version updates (SOC 2 SSDLC, qfg-66ko.3). Weekly; minor and
# patch bumps are grouped into one PR per ecosystem, majors stay separate.
# Security updates are enabled in the repo settings and are not grouped here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 2.x requires react-native >=0.81 and the New Architecture, but this
      # package declares react-native >=0.70. Raising that floor is a major
      # release, so hold this dependency on 1.x until we decide to (qfg-obhe).
      - dependency-name: react-native-get-random-values
        update-types: ["version-update:semver-major"]
